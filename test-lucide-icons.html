<!DOCTYPE html>
<html>
<head>
  <title>Lucide Icons Test</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin: 20px 0; }
    .icon-item { text-align: center; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
    .icon-item h3 { margin: 10px 0 5px 0; font-size: 14px; }
    .icon-item svg { width: 48px; height: 48px; margin: 10px; }
  </style>
</head>
<body>
  <h1>Lucide Icons for Badge Generation</h1>
  
  <div class="icon-grid">
    <div class="icon-item">
      <h3>Calculator</h3>
      <i data-lucide="calculator"></i>
      <p>電卓・数字計算</p>
    </div>
    
    <div class="icon-item">
      <h3>Brain</h3>
      <i data-lucide="brain"></i>
      <p>思考・学習・コンサル</p>
    </div>
    
    <div class="icon-item">
      <h3>Bot</h3>
      <i data-lucide="bot"></i>
      <p>AI・ロボット</p>
    </div>
    
    <div class="icon-item">
      <h3>Rocket</h3>
      <i data-lucide="rocket"></i>
      <p>DX・推進・成長</p>
    </div>
    
    <div class="icon-item">
      <h3>TrendingUp</h3>
      <i data-lucide="trending-up"></i>
      <p>マーケティング・成果</p>
    </div>
    
    <div class="icon-item">
      <h3>Users</h3>
      <i data-lucide="users"></i>
      <p>チーム・リーダーシップ</p>
    </div>
    
    <div class="icon-item">
      <h3>DollarSign</h3>
      <i data-lucide="dollar-sign"></i>
      <p>金融・ファイナンス</p>
    </div>
    
    <div class="icon-item">
      <h3>Trophy</h3>
      <i data-lucide="trophy"></i>
      <p>成果・達成</p>
    </div>
    
    <div class="icon-item">
      <h3>Lightbulb</h3>
      <i data-lucide="lightbulb"></i>
      <p>アイデア・創造</p>
    </div>
    
    <div class="icon-item">
      <h3>BarChart3</h3>
      <i data-lucide="bar-chart-3"></i>
      <p>データ分析・統計</p>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
